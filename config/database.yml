default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>


development:
  <<: *default
  database: email_parser_development
test:
  <<: *default
  database: email_parser_test
production:
  primary: &primary_production
    <<: *default
    database: email_parser_production
    username: email_parser
    password: <%= ENV["EMAIL_PARSER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: email_parser_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: email_parser_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: email_parser_production_cable
    migrations_paths: db/cable_migrate
